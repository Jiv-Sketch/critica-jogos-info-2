{% extends "base.html" %}

{% block titulo %}Criar conta - Metacritic Games{% endblock %}

{% block conteudo %}
<div class="topo">
    <h1>Criar conta</h1>
</div>

<form class="dados" method="post" action="{{ url_for('registro') }}">
    <label for="nome">Usuário</label>
    <input type="text" id="nome" name="nome" minlength="3" maxlength="50" required value="{{ nome }}">

    <label for="senha">Senha (mínimo 6 caracteres)</label>
    <input type="password" id="senha" name="senha" minlength="6" required>

    <label for="confirmar">Confirmar senha</label>
    <input type="password" id="confirmar" name="confirmar" minlength="6" required>

    <div class="botoes">
        <button type="submit" class="btn">Criar conta</button>
        <a class="btn btn-sec" href="{{ url_for('login') }}">Já tenho conta</a>
    </div>
</form>
{% endblock %}
