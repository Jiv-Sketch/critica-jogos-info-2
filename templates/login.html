{% extends "base.html" %}

{% block titulo %}Entrar - Metacritic Games{% endblock %}

{% block conteudo %}
<div class="topo">
    <h1>Entrar</h1>
</div>

<form class="dados" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ proximo }}">

    <label for="nome">Usuário</label>
    <input type="text" id="nome" name="nome" maxlength="50" required value="{{ nome }}">

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required>

    <div class="botoes">
        <button type="submit" class="btn">Entrar</button>
        <a class="btn btn-sec" href="{{ url_for('registro') }}">Criar conta</a>
    </div>
</form>
{% endblock %}
